<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5ff"/><stop offset=".42" stop-color="#b9c7ff"/><stop offset="1" stop-color="#7562df"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#36c9ff"/><stop offset=".48" stop-color="#6975ff"/><stop offset="1" stop-color="#b45bfa"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="13"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".38"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="spark"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="screenClip"><rect x="101" y="151" width="310" height="246" rx="35"/></clipPath>
</defs>
