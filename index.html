<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101018"><link rel="manifest" href="manifest.json"><title>My Watchlist</title>
<style>
:root{color-scheme:dark;--bg:#101018;--panel:#1a1a26;--muted:#9999ad;--line:#303044;--accent:#a78bfa;--text:#f5f3ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29203e 0,#101018 48%);color:var(--text);font:15px system-ui,-apple-system,sans-serif;min-height:100vh}header{padding:28px 22px 18px;max-width:900px;margin:auto}h1{font-size:30px;margin:0;letter-spacing:-1px}header p{color:var(--muted);margin:5px 0}main{max-width:900px;margin:auto;padding:0 18px 60px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 22px}.stat,.panel,.item{background:#1a1a26dd;border:1px solid var(--line);border-radius:17px;padding:15px}.stat b{display:block;font-size:25px}.stat span,.muted{color:var(--muted);font-size:12px}.panel{margin:14px 0}h2{font-size:17px;margin:0 0 12px}.search{display:flex;gap:8px}input,select{min-width:0;background:#101018;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text);font:inherit}input{flex:1}button{background:var(--accent);color:#171322;border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}.list{display:grid;gap:10px}.item{display:flex;gap:13px;align-items:center}.cover{width:55px;height:76px;object-fit:cover;border-radius:9px;background:#303044}.details{flex:1;min-width:0}.details strong{display:block}.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:12px}.ghost{background:#303044;color:var(--text)}.empty{color:var(--muted);text-align:center;padding:20px}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{background:#303044;color:var(--text)}.tabs button.active{background:var(--accent);color:#171322}.error{color:#fda4af;font-size:13px}@media(max-width:520px){.stats{gap:7px}.stat{padding:11px}.stat b{font-size:21px}.search{flex-wrap:wrap}.search input{flex-basis:100%}}
</style></head><body><header><h1>My Watchlist <span style="color:#a78bfa">✦</span></h1><p>Todo lo que sigues. Nada que se te escape.</p></header><main>
<div class="stats"><div class="stat"><b id="total">0</b><span>EN MI LISTA</span></div><div class="stat"><b id="pending">0</b><span>POR VER</span></div><div class="stat"><b id="next">—</b><span>PRÓXIMO ESTRENO</span></div></div>
<section class="panel"><h2>＋ Añadir anime</h2><div class="search"><input id="query" placeholder="Busca un anime…"><button id="search">Buscar</button></div><div id="results" class="list" style="margin-top:12px"></div><p id="msg" class="error"></p></section>
<section class="panel"><h2>Mi biblioteca</h2><div class="tabs"><button class="active" data-filter="all">Todo</button><button data-filter="watching">Viendo</button><button data-filter="completed">Terminados</button></div><div id="library" class="list"></div></section>
<p class="muted">Los datos se guardan en este dispositivo. Anime y calendarios consultados mediante AniList.</p>
</main><script>
const $=s=>document.querySelector(s);let items=JSON.parse(localStorage.getItem('mw-items')||'[]'),filter='all';
function save(){localStorage.setItem('mw-items',JSON.stringify(items));render()}
function render(){let pending=items.reduce((n,x)=>n+Math.max(0,(x.total||0)-x.progress),0);$('#total').textContent=items.length;$('#pending').textContent=pending;$('#next').textContent='—';let arr=items.filter(x=>filter==='all'||x.status===filter);$('#library').innerHTML=arr.length?arr.map(x=>'<article class="item"><img class="cover" src="'+(x.cover||'')+'" onerror="this.style.visibility=\'hidden\'"><div class="details"><strong>'+esc(x.title)+'</strong><span class="muted">'+x.progress+'/'+(x.total||'?')+' episodios · '+(x.status==='completed'?'Terminado':'Viendo')+'</span><div class="actions"><button class="ghost" onclick="step(\''+x.id+'\',-1)">−</button><button onclick="step(\''+x.id+'\',1)">+ Episodio</button><button class="ghost" onclick="done(\''+x.id+'\')">✓</button><button class="ghost" onclick="removeItem(\''+x.id+'\')">✕</button></div></div></article>').join(''):'<div class="empty">Aún no has añadido nada. Busca tu primer anime arriba.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function step(id,n){let x=items.find(a=>a.id===id);x.progress=Math.max(0,Math.min(x.total||999,x.progress+n));if(x.total&&x.progress>=x.total)x.status='completed';save()}
function done(id){let x=items.find(a=>a.id===id);x.progress=x.total||x.progress;x.status='completed';save()}
function removeItem(id){items=items.filter(x=>x.id!==id);save()}
async function search(){let q=$('#query').value.trim();if(!q)return;$('#msg').textContent='Buscando…';$('#results').innerHTML='';try{let r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query:'query ($search:String){Page(perPage:8){media(search:$search,type:ANIME,sort:SEARCH_MATCH){id title{romaji english} episodes coverImage{large} status}}}',variables:{search:q}})});let j=await r.json();let found=j.data.Page.media;$('#results').innerHTML=found.map(x=>'<article class="item"><img class="cover" src="'+x.coverImage.large+'"><div class="details"><strong>'+esc(x.title.english||x.title.romaji)+'</strong><span class="muted">'+(x.episodes||'?')+' episodios · '+x.status+'</span></div><button onclick="add('+x.id+')">Añadir</button></article>').join('');$('#msg').textContent=''}catch(e){$('#msg').textContent='No se pudo conectar con AniList. Inténtalo de nuevo.'}}
let foundCache={};window.add=async id=>{try{let r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'query($id:Int){Media(id:$id){id title{romaji english}episodes coverImage{large}}}',variables:{id}})});let x=(await r.json()).data.Media;if(!items.some(a=>a.id===String(id)))items.push({id:String(id),title:x.title.english||x.title.romaji,total:x.episodes||0,progress:0,cover:x.coverImage.large,status:'watching'});save();$('#results').innerHTML='';$('#msg').textContent='Añadido a tu biblioteca.'}catch(e){$('#msg').textContent='No se pudo añadir.'}};
$('#search').onclick=search;$('#query').addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
